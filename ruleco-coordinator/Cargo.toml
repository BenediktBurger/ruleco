[package]
name = "ruleco-coordinator"
workspace = ".."
edition = "2021"

[dependencies]
zmq = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonrpsee-types = "0.26"
ruleco-core = { path = "../ruleco-core"}
toml = "0.8"
hostname = "^0.4"
dirs = "6.0.0"
dns-lookup = "2.0"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
signal-hook = "0.3"
crossbeam-channel = "0.5"

[dev-dependencies]
mockall = "0.13.1"
rstest = "0.26"
